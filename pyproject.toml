[project]
name = "geonnax"
version = "0.0.0"
description = "Pure-Equinox neural-network zoo: SIREN, MFN, random features, SNGP, VSSGP, conditioning, geo encoders, Slepian, and shared eigenfunction bases."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["jax", "equinox", "neural-networks", "siren", "random-features", "spherical-harmonics", "slepian"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.10",
    "equinox>=0.13.8",
    "jaxtyping>=0.2",
    "einops>=0.8.2",
    "einx>=0.4.3",
]

[project.urls]
Repository = "https://github.com/jejjohnson/geonnax"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.37",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.3",
    "ipykernel>=7.2.0",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.10.9",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.20.0,<2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geonnax"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/geonnax --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
source = ["src/geonnax"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff.lint.per-file-ignores]
# jaxtyping's string shape annotations (`Float[Array, "N D"]`) trip F722.
# Greek/math notation in docstrings + einx specs trips RUF001/2/3.
"src/geonnax/**" = ["F722", "RUF001", "RUF002", "RUF003"]
"tests/**" = ["F722", "RUF001", "RUF002", "RUF003"]
