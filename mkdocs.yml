site_name: geonnax
site_description: Pure-Equinox neural-network zoo for geoscientific machine learning.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/geonnax
repo_name: jejjohnson/geonnax

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  - Examples:
      - Demo: notebooks/example_demo.ipynb
  - API Reference:
      - Overview: api/index.md
      - Operators (FNO / SFNO): api/operators.md
      - U-Net: api/unet.md
      - Building Blocks: api/layers.md
      - Representation Networks: api/representation.md
      - Encoders & Geometry: api/encoders.md
      - Uncertainty & Bayesian: api/uncertainty.md
      - Spectral Bases: api/bases.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
