# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, guides, design
# records and the executed example notebooks. The API reference is built
# separately by Zensical + mkdocstrings and mounted at `/reference/`. See
# `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built API `site/` on this exact port, then rewrites the resulting localhost
# URLs to the deployed `/reference/` path. Keep the port in sync with API_PORT
# in that script.
# ---------------------------------------------------------------------------
version: 1

project:
  id: geonnax-docs
  title: geonnax
  description: >-
    Pure-Equinox neural-network zoo for geoscientific machine learning: neural
    operators, U-Nets, representation networks, encoders and spectral bases.
  github: https://github.com/jejjohnson/geonnax
  authors:
    - name: J. Emmanuel Johnson
  references:
    api: http://127.0.0.1:8910/
  exclude:
    - README.md
    - templates/**
    - api/**
  toc:
    - file: index.md
    - title: Getting started
      children:
        - file: agents.md
          title: Building with agents
        - url: https://jejjohnson.github.io/geonnax/reference/capabilities/
          title: Capability index
    - title: Guides
      children:
        - file: guides/methane.md
          title: Map methane around the globe
        - file: guides/irregular-geometry.md
          title: FNO on curvilinear grids
    - title: Examples
      children:
        - file: notebooks/irregular_geometry.ipynb
          title: Mediterranean SSH, three ways
    - title: Design
      children:
        - file: decisions/irregular-geometry-operators.md
          title: Irregular-geometry operators
        - file: decisions/geofno-latent-measure.md
          title: Geo-FNO latent measure
    - title: Project
      children:
        - file: contributing.md
          title: Contributing
        - file: CHANGELOG.md
          title: Changelog

site:
  title: geonnax
  template: book-theme
  options:
    logo: assets/icon.svg
    logo_text: geonnax
  # mystmd requires a full URL here (both `/reference/` and `reference/` are
  # rejected), so the deployed location is hard-coded the way `repo_url` is in
  # mkdocs.yml.
  #
  # Do NOT rewrite this to a root-relative path at build time. The theme
  # re-renders the nav from this config on hydration and prepends BASE_URL to
  # any URL starting with `/`, so a rewritten value becomes
  # `/geonnax/geonnax/reference/` and 404s. An absolute URL is treated as
  # external and left alone. The cost is that a local preview's nav button
  # points at the deployed site.
  nav:
    - title: API reference
      url: https://jejjohnson.github.io/geonnax/reference/
